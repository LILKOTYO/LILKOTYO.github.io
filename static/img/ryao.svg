<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景（可选，导出时可去除） -->
  <rect width="200" height="200" fill="#ffffff" opacity="0"/>

  <!-- 外圈轨道 -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#gradient1)"
          stroke-width="1.5" opacity="0.3" stroke-dasharray="8,4"/>

  <!-- 内圈轨道 -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#gradient1)"
          stroke-width="1" opacity="0.2" stroke-dasharray="5,3"/>

  <!-- 中心字母 R -->
  <g transform="translate(100, 100)">
    <!-- R 的主体 -->
    <path d="M -20 -35 L -20 35 M -20 -35 L 0 -35 Q 15 -35 15 -20 Q 15 -5 0 -5 L -20 -5 M 0 -5 L 18 35"
          fill="none" stroke="url(#gradient1)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- 装饰圆点（小行星） -->
  <circle cx="100" cy="15" r="3" fill="url(#gradient1)" opacity="0.6"/>
  <circle cx="185" cy="100" r="2.5" fill="url(#gradient1)" opacity="0.5"/>
  <circle cx="100" cy="185" r="2" fill="url(#gradient1)" opacity="0.4"/>
  <circle cx="15" cy="100" r="2.5" fill="url(#gradient1)" opacity="0.5"/>

  <!-- 装饰星星 -->
  <g opacity="0.6">
    <path d="M 160 45 l 1.5 4.5 l 4.5 1.5 l -4.5 1.5 l -1.5 4.5 l -1.5 -4.5 l -4.5 -1.5 l 4.5 -1.5 z"
          fill="url(#gradient1)"/>
    <path d="M 45 160 l 1 3 l 3 1 l -3 1 l -1 3 l -1 -3 l -3 -1 l 3 -1 z"
          fill="url(#gradient1)"/>
  </g>
</svg>