<header class="site-header">
  <div class="container header-inner">
    <a href="{{ "/" | relURL }}" class="site-brand">
      {{ with .Site.Params.logo }}
        <img src="{{ . | relURL }}" alt="Logo" class="site-logo">
      {{ end }}
      <span class="site-title">{{ .Site.Title }}</span>
    </a>
    <div class="header-right">
      <nav class="site-nav">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
      <button class="search-toggle" onclick="openSearch()" aria-label="搜索" title="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
</header>
